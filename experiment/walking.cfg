# walking.cfg — LLM4Walking experiment configuration
# Compatible with upstream rapidstore/config.cfg, extended for walking
#
# Usage: ./walking_experiment walking.cfg

# ─── Graph Parameters ────────────────────────────────────────────
num_vertices = 5000
num_edges    = 25000
seed         = 42

# edge_file =      # blank=synthetic; path=load from file
# vertex_file =    # same

# ─── Threading ───────────────────────────────────────────────────
num_threads = 1

# ─── BFS Parameters (upstream naming preserved) ──────────────────
alpha = 15
beta  = 18
bfs_source = 0

# ─── SSSP Parameters ─────────────────────────────────────────────
delta = 2.0
sssp_source = 0

# ─── PageRank Parameters ─────────────────────────────────────────
num_iterations = 10
damping_factor = 0.85

# ─── Debug Level ──────────────────────────────────────────────────
# 0=silent 1=summary 2=per-level 3=per-edge
debug_level = 2

# ─── Triangle Counting (slow on large graphs, off by default) ────
run_tc = false
