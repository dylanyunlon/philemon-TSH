# philemon_experiment.cfg
# 格式兼容 upstream/rapidstore/config.cfg, 扩展了 philemon 参数
#
# 用法: ./philemon_experiment philemon_experiment.cfg

# ─── Graph Parameters ────────────────────────────────────────────
num_vertices = 5000
num_edges    = 25000
seed         = 42

# edge_file =      # 留空=合成数据; 填路径=从文件加载
# vertex_file =    # 同上

# ─── Threading (upstream 用 num_threads + query_num_threads) ──────
num_threads = 1

# ─── BFS Parameters (保留upstream命名) ────────────────────────────
alpha = 15
beta  = 18
bfs_source = 0

# ─── SSSP Parameters ─────────────────────────────────────────────
delta = 2.0
sssp_source = 0

# ─── PageRank Parameters ─────────────────────────────────────────
num_iterations = 10
damping_factor = 0.85

# ─── Debug Level ──────────────────────────────────────────────────
# 0=silent 1=summary 2=per-level 3=per-edge
debug_level = 2

# ─── Triangle Counting (大图慢, 默认关闭) ─────────────────────────
run_tc = false
